name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Prep commit message
        run: |
          version=""
          if pnpm changeset status --output=release.json >/dev/null; then
            version="$(jq -r '.releases[0].newVersion // empty' release.json)"
            rm -f release.json
          fi
          printf 'NEW_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - uses: changesets/action@v1
        with:
          commit: "chore: release v${{ env.NEW_VERSION }}"
          title: "Release v${{ env.NEW_VERSION }}"
          publish: pnpm publish --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
